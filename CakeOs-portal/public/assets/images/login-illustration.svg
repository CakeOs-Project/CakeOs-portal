<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="CakeOS">

  <rect x="1" y="1" width="598" height="478" rx="24" fill="#f4f4f4" stroke="#D89B34" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- dashboard cards -->
  <rect x="60" y="60" width="180" height="120" rx="12" fill="#ffffff"/>
  <rect x="80" y="84" width="140" height="10" rx="5" fill="#09122c" opacity="0.15"/>
  <rect x="80" y="106" width="100" height="10" rx="5" fill="#D89B34" opacity="0.6"/>
  <rect x="80" y="128" width="120" height="34" rx="6" fill="#09122c" opacity="0.06"/>

  <rect x="360" y="60" width="180" height="120" rx="12" fill="#ffffff"/>
  <circle cx="450" cy="120" r="38" fill="none" stroke="#D89B34" stroke-width="10" stroke-dasharray="70 200" stroke-linecap="round"/>
  <circle cx="450" cy="120" r="38" fill="none" stroke="#09122c" stroke-width="10" opacity="0.12"/>

  <!-- table / counter -->
  <rect x="40" y="330" width="520" height="14" rx="7" fill="#09122c" opacity="0.85"/>
  <rect x="60" y="344" width="480" height="70" fill="#151c31" opacity="0.9"/>

  <!-- cake stand -->
  <ellipse cx="300" cy="340" rx="70" ry="10" fill="#09122c" opacity="0.15"/>
  <rect x="270" y="240" width="60" height="36" rx="4" fill="#D89B34"/>
  <rect x="250" y="276" width="100" height="36" rx="4" fill="#f0c87a"/>
  <rect x="230" y="312" width="140" height="28" rx="4" fill="#D89B34"/>
  <circle cx="300" cy="232" r="8" fill="#09122c"/>
  <rect x="297" y="214" width="6" height="20" rx="3" fill="#09122c"/>

  <!-- cupcakes -->
  <g transform="translate(140,250)">
    <path d="M0 30 Q20 -10 40 30 Z" fill="#f0c87a"/>
    <rect x="4" y="30" width="32" height="26" rx="4" fill="#D89B34"/>
    <circle cx="20" cy="6" r="6" fill="#151c31" opacity="0.25"/>
  </g>

  <g transform="translate(420,250)">
    <path d="M0 30 Q20 -10 40 30 Z" fill="#f0c87a"/>
    <rect x="4" y="30" width="32" height="26" rx="4" fill="#151c31" opacity="0.85"/>
    <circle cx="20" cy="6" r="6" fill="#D89B34"/>
  </g>

  <!-- floating sparkles -->
  <circle cx="100" cy="220" r="5" fill="#D89B34"/>
  <circle cx="500" cy="220" r="5" fill="#151c31" opacity="0.4"/>
  <circle cx="300" cy="60" r="5" fill="#D89B34" opacity="0.6"/>

  <text x="300" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#09122c" opacity="0.45">
    Imagen temporal — reemplazar por la ilustración final
  </text>

</svg>
