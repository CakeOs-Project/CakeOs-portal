<header class="app-header">
  <div class="header__left">
    <h1 class="header__title">{{ title() }}</h1>
  </div>

  <div class="header__right">
    <!-- Barra de búsqueda -->
    <div class="header__search">
      <svg class="header__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        class="header__search-input"
        placeholder="Buscar clientes, pedidos..."
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchChange($event)"
        aria-label="Buscar clientes o pedidos"
      />
    </div>

    <!-- Botones de Acción -->
    <div class="header__buttons">
      <button
        type="button"
        class="header__icon-btn"
        (click)="onSettingsClick()"
        title="Configuración"
        aria-label="Configuración"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <button
        type="button"
        class="header__icon-btn"
        (click)="onHelpClick()"
        title="Ayuda"
        aria-label="Ayuda"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
    </div>

    <!-- Divisor -->
    <div class="header__divider"></div>

    <!-- Perfil de Usuario -->
    <div class="header__profile" role="button" tabindex="0">
      <div class="header__profile-info">
        <span class="header__profile-name">{{ userName() }}</span>
        <span class="header__profile-role">{{ userRole() }}</span>
      </div>

      <div class="header__avatar-wrapper">
        @if (!imageError()) {
          <img
            src="assets/images/login-illustration.svg"
            alt="Avatar del usuario"
            class="header__avatar-img"
            (error)="onImageError()"
          />
        } @else {
          <div class="header__avatar-fallback">
            {{ userInitials() }}
          </div>
        }
      </div>
    </div>
  </div>
</header>
