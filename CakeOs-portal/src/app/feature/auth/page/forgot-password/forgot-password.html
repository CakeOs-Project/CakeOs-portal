<div class="login-page">

  <div class="auth-container">

    <div class="image-section">
      <img
        src="assets/images/login-illustration.svg"
        alt="CakeOS">
    </div>

    <div class="form-section">

      <div class="login-form">

        <div class="logo-container">
          <img
            src="assets/logo/cakeos-logo.svg"
            alt="CakeOS">
          <h1>CakeOS</h1>
        </div>

        <p class="form-description">
          Ingresa tu correo y la nueva contraseña para restablecer el acceso a tu cuenta.
        </p>

        <form>

          <div class="input-group">
            <label>Correo</label>
            <input type="text" placeholder="correo@gmail.com">
          </div>

          <div class="input-group">
            <label>Nueva contraseña</label>
            <input type="password" placeholder="********">
          </div>

          <div class="input-group">
            <label>Confirmar contraseña</label>
            <input type="password" placeholder="********">
          </div>

          <button type="button" class="auth-button" (click)="cambiarContrasena()">
            Cambiar contraseña →
          </button>

          <a class="back-to-login" (click)="volverAlInicio()">
            ← Volver al inicio de sesión
          </a>

        </form>

      </div>

    </div>

  </div>

</div>
