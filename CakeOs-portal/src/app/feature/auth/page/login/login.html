<div class="login-page">

  <app-auth-layout>

    <div class="login-form">

      <app-auth-logo></app-auth-logo>

      <form (ngSubmit)="onSubmit()">

        <app-auth-input
          label="Correo"
          placeholder="correo@gmail.com"
          [(value)]="email">
        </app-auth-input>

        <app-auth-input
          label="Contraseña"
          type="password"
          placeholder="********"
          [(value)]="password">
        </app-auth-input>

        @if (errorMessage()) {
          <p class="login-error">{{ errorMessage() }}</p>
        }

        <a class="forgot-password" routerLink="/auth/forgot-password">
          ¿Olvidaste tu contraseña?
        </a>

        <app-auth-button>
          {{ loading() ? 'Ingresando...' : 'Iniciar Sesión →' }}
        </app-auth-button>

      </form>

    </div>

  </app-auth-layout>

</div>
