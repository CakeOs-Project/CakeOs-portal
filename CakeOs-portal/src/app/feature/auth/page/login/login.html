<div class="login-page">

  <app-auth-layout>

    <div class="login-form">

      <app-auth-logo></app-auth-logo>

      <form>

        <app-auth-input
          label="Correo"
          placeholder="correo@gmail.com">
        </app-auth-input>

        <app-auth-input
          label="Contraseña"
          type="password"
          placeholder="********">
        </app-auth-input>

        <a class="forgot-password">
          ¿Olvidaste tu contraseña?
        </a>

        <app-auth-button>
          Iniciar Sesión →
        </app-auth-button>

      </form>

    </div>

  </app-auth-layout>

</div>
